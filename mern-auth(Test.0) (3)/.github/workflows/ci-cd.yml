name: HustleHub+ CI/CD Pipeline & DevSecOps

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── 1. Security & Vulnerability Auditing ────────────────────────────────────
  security_audit:
    name: DevSecOps Vulnerability & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Run Backend Dependency Security Audit
        run: |
          cd server
          npm audit --audit-level=high || true

      - name: Run Frontend Dependency Security Audit
        run: |
          cd client
          npm audit --audit-level=high || true

      - name: Run Trivy Repository Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ─── 2. Backend Automated Testing ───────────────────────────────────────────
  backend_tests:
    name: Backend Unit, Security & API Testing
    runs-on: ubuntu-latest
    needs: security_audit

    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Local SSL Certificates
        run: |
          cd server
          node generate-certs.js

      - name: Run Backend Security & Unit Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/hustlehub-plus-test
          JWT_SECRET: ci_secret_token_key_hustlehub_test_123!
        run: |
          cd server
          node --test test/api.test.js

      - name: Start Backend Server for Newman API Tests
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/hustlehub-plus-test
          JWT_SECRET: ci_secret_token_key_hustlehub_test_123!
          CLIENT_URL: http://localhost:5173
          USE_HTTPS: "false"
        run: |
          cd server
          node server.js &
          sleep 5

      - name: Run Newman Automated API Collection Tests
        run: |
          npx newman run "HustleHub_Plus_API.postman_collection.json" \
            --reporters cli \
            --delay-request 100 \
            --timeout-request 5000

  # ─── 3. Frontend Automated Testing & Build ─────────────────────────────────
  frontend_tests:
    name: Frontend Component Testing & Production Build
    runs-on: ubuntu-latest
    needs: security_audit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Run Frontend Unit & Component Tests
        run: |
          cd client
          npm test

      - name: Verify Frontend Production Build
        run: |
          cd client
          npm run build

  # ─── 4. Container Build & Packaging ─────────────────────────────────────────
  docker_build:
    name: Container Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend_tests, frontend_tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t hustlehub-api:latest ./server

      - name: Build Frontend Docker Image
        run: |
          docker build -t hustlehub-client:latest ./client
