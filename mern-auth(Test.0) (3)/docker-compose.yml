services:
  mongodb:
    image: mongo:7-jammy
    container_name: hustlehub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hustlehub-plus
    volumes:
      - mongodb_data:/data/db
    networks:
      - hustlehub_net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hustlehub_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hustlehub-plus
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production_HustleHub2024!
      CLIENT_URL: http://localhost:3000
      USE_HTTPS: "false"
    depends_on:
      - mongodb
    networks:
      - hustlehub_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: hustlehub_client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api
    networks:
      - hustlehub_net

volumes:
  mongodb_data:
    driver: local

networks:
  hustlehub_net:
    driver: bridge
